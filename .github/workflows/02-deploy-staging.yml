name: 02 - Continuous Deployment

on:
  workflow_run:
    workflows:
      - "01 - CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

# Keep staging validation and production promotion in the same serialized run.
concurrency:
  group: continuous-deployment-main
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}

    environment:
      name: staging

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create staging namespace
        run: |
          kubectl create namespace staging \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace staging \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace staging \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/staging/

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ env.IMAGE_TAG }} \
            -n staging

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ env.IMAGE_TAG }} \
            -n staging

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ env.IMAGE_TAG }} \
            -n staging

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ env.IMAGE_TAG }} \
            -n staging

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ env.IMAGE_TAG }} \
            -n staging

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ env.IMAGE_TAG }} \
            -n staging

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n staging \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n staging \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n staging \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n staging \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n staging \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n staging \
            --timeout=300s

      - name: Show staging resources
        run: |
          kubectl get pods -n staging
          kubectl get services -n staging
          kubectl get pvc -n staging

  staging-test:
    name: Staging Smoke Test
    needs: deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."

            sleep 10
          done

          echo "Unable to find staging frontend IP."
          exit 1

      - name: Test frontend
        run: |
          curl \
            --fail \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 10 \
            --retry-delay 5 \
            http://${{ env.FRONTEND_IP }}

  deploy-production:
    name: Deploy to Production
    needs: staging-test
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n production \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production
